apiVersion: apps/v1
kind: Deployment
metadata:
  name: menu
spec:
  replicas: 2
  selector:
    matchLabels:
      app: menu
  template:
    metadata:
      labels:
        app: menu
    spec:
      containers:
      - name: menu
        image: registry.taco.lan/menu:1.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
