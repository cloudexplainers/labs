# The central log server: accept log lines over TCP port 514 and keep each sender's lines in its own file.
module(load="imtcp")
template(name="PerHost" type="string" string="/var/log/remote/%HOSTNAME%.log")
ruleset(name="remote") {
  action(type="omfile" dynaFile="PerHost" dirCreateMode="0755" fileCreateMode="0640" fileGroup="adm")
}
input(type="imtcp" port="514" ruleset="remote")
