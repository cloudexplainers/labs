apiVersion: apps/v1
kind: Deployment
metadata:
  name: lanes
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lanes
  template:
    metadata:
      labels:
        app: lanes
    spec:
      containers:
      - name: lanes
        image: lanes:1.0
        ports:
        - containerPort: 8080
