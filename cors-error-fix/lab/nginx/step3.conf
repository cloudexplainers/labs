# Driftwood Surf School: the booking page and its API, both on this server.
server {
    listen 80;
    server_name www.surf.test;
    root /var/www/surfschool;
    access_log /var/log/nginx/www.log surf;
}

server {
    listen 80;
    server_name api.surf.test;
    access_log /var/log/nginx/api.log surf;

    location / {
        add_header Access-Control-Allow-Origin "http://www.surf.test";
        add_header Access-Control-Allow-Credentials "true";
        add_header Access-Control-Allow-Headers "Content-Type";
        proxy_pass http://127.0.0.1:5000;
    }
}
