# The lab's DNS server: the records two small companies would publish for their mail.
no-resolv
no-hosts
listen-address=203.0.113.53,127.0.0.1
bind-interfaces
local-ttl=3600
domain-needed
local=/test/
host-record=dns.test,203.0.113.53
host-record=mail.bloom.test,203.0.113.25
host-record=mx.harbor.test,203.0.113.30
host-record=ana-laptop.bloom.test,203.0.113.101
host-record=ben-laptop.harbor.test,203.0.113.102
mx-host=bloom.test,mail.bloom.test,10
mx-host=harbor.test,mx.harbor.test,10
txt-record=bloom.test,"v=spf1 ip4:203.0.113.25 -all"
