apiVersion: apps/v1
kind: Deployment
metadata:
  name: requests
spec:
  replicas: 3
  selector:
    matchLabels:
      app: requests
  template:
    metadata:
      labels:
        app: requests
    spec:
      containers:
      - name: board
        image: requests:1.0
        ports:
        - containerPort: 8080
