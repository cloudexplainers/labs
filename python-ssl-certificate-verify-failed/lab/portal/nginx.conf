# The co-op's milk portal. portal.coop.lan has a current certificate from the co-op's own CA; tank.coop.lan is the
# old tank-readings address, whose certificate expired on 2026-10-01 and was never renewed.
server {
    listen 443 ssl default_server;
    server_name portal.coop.lan;
    ssl_certificate     /etc/nginx/certs/portal.crt;
    ssl_certificate_key /etc/nginx/certs/portal.key;
    default_type application/json;
    location = /api/readings { return 200 '{"saved": true, "tank": 1}\n'; }
    location / { return 200 '{"portal": "Valley Dairy Co-op"}\n'; }
}
server {
    listen 443 ssl;
    server_name tank.coop.lan;
    ssl_certificate     /etc/nginx/certs/tank.crt;
    ssl_certificate_key /etc/nginx/certs/tank.key;
    default_type application/json;
    location / { return 200 '{"saved": true, "tank": 1}\n'; }
}
