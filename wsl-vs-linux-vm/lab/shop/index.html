<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mike's Flowers: Mother's Day orders</title>
<style>
  body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; margin: 0; background: #fbf6f1; color: #2b2320; }
  header { background: #7a2e4a; color: #fff; padding: 22px 28px; }
  header h1 { margin: 0; font-size: 30px; }
  header p { margin: 4px 0 0; opacity: .85; }
  main { padding: 22px 28px; max-width: 760px; }
  .bunch { display: flex; justify-content: space-between; align-items: center; background: #fff; border: 1px solid #e6d8cf;
           border-radius: 12px; padding: 14px 18px; margin: 10px 0; }
  .bunch b { font-size: 20px; }
  .price { font-weight: 700; color: #7a2e4a; font-size: 20px; }
  button { background: #2f7a4a; color: #fff; border: 0; border-radius: 10px; padding: 12px 22px; font-size: 18px; }
  footer { padding: 6px 28px 24px; color: #6b5b55; }
</style>
</head>
<body>
<header><h1>Mike's Flowers</h1><p>Mother's Day orders &middot; pick up Saturday or Sunday</p></header>
<main>
  <div class="bunch" id="tulips"><b>Spring tulips</b><span class="price">$28</span></div>
  <div class="bunch" id="roses"><b>A dozen roses</b><span class="price">$45</span></div>
  <div class="bunch" id="mixed"><b>Mixed garden bunch</b><span class="price">$35</span></div>
  <p><button id="order">Take an order</button></p>
</main>
<footer>Counter tablet: Trish</footer>
</body>
</html>
