services:
  site:
    image: python:3.12-alpine
    command: python -m http.server 8080 --directory /site
    volumes:
      - ./site:/site:ro
    ports:
      - "8080:8080"
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:2026.11.1
    command: tunnel --no-autoupdate --protocol http2 --url http://site:8080
    restart: unless-stopped

  nas:
    image: python:3.12-alpine
    command: sh -c "cd /nas/www && python /nas/serve.py"
    volumes:
      - ./nas:/nas:ro
    restart: unless-stopped

  nas-tunnel:
    image: cloudflare/cloudflared:2026.11.1
    command: tunnel --no-autoupdate --protocol http2 --url https://nas:443
    restart: unless-stopped
